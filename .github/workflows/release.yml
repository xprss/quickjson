name: Release

on:
  push:
    # GitHub filters are globs, not semantic-version regular expressions.
    # The validate job below is the authoritative strict validation.
    tags: ["v*"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
    steps:
      - name: Validate semantic version tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "${tag}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid release tag: ${tag}" >&2
            exit 1
          fi
          version="${tag#v}"
          IFS=. read -r major minor patch <<< "${version}"
          if (( minor > 999 || patch > 999 )); then
            echo "minor and patch must be <= 999" >&2
            exit 1
          fi
          code=$((major * 1000000 + minor * 1000 + patch))
          if (( code < 1 || code > 2100000000 )); then
            echo "versionCode is outside the supported range" >&2
            exit 1
          fi
          echo "version_name=${version}" >> "${GITHUB_OUTPUT}"
          echo "version_code=${code}" >> "${GITHUB_OUTPUT}"

  checks:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: gradle/actions/wrapper-validation@0723195856401067f7a2779048b490ace7a47d7c
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
      - run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          --channel=3
          "platforms;android-37.0"
          "build-tools;36.0.0"
      - run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebugAndroidTest

  instrumented:
    needs: [validate, checks]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 31
            channel: stable
          - api: 36
            channel: stable
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
      - run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          --channel=3
          "platforms;android-37.0"
          "build-tools;36.0.0"
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          channel: ${{ matrix.channel }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: ./gradlew --no-daemon connectedDebugAndroidTest

  publish:
    needs: [validate, checks, instrumented]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION_NAME: ${{ needs.validate.outputs.version_name }}
      VERSION_CODE: ${{ needs.validate.outputs.version_code }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
      - run: >-
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          --channel=3
          "platforms;android-37.0"
          "build-tools;36.0.0"
      - name: Decode signing key in runner temporary directory
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "${KEYSTORE_BASE64}"
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/quickjson-release.jks"
          chmod 600 "${RUNNER_TEMP}/quickjson-release.jks"
          echo "ANDROID_KEYSTORE_PATH=${RUNNER_TEMP}/quickjson-release.jks" >> "${GITHUB_ENV}"
      - name: Build optimized release APK
        run: ./gradlew --no-daemon assembleRelease
      - name: Verify signature and prepare assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          apk="app/build/outputs/apk/release/app-release.apk"
          output="release-assets/quickjson-v${VERSION_NAME}.apk"
          cp "${apk}" "${output}"
          apksigner="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -1)"
          "${apksigner}" verify --verbose --print-certs "${output}"
          sha256sum "${output}" > "${output}.sha256"
          cp app/build/outputs/mapping/release/mapping.txt "release-assets/quickjson-v${VERSION_NAME}-mapping.txt"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f
        with:
          subject-path: release-assets/*
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
